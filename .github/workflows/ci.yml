name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint, typecheck (incl. typed routes), unit tests, bundle build
        run: pnpm verify
      - name: Dependency audit (production, critical)
        # Known high advisory in Expo CLI's node-forge has no patched version yet;
        # tracked in docs/RISK_REGISTER.md (R19). Tighten to "high" once patched.
        run: pnpm audit --prod --audit-level critical
